name: Reprocess archive

# Manual only. Re-derives every card in data/cards/ from the archived PDFs,
# which is what you run after changing the parser. This is the one job that
# genuinely needs the PDFs, so it takes the full checkout.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-derive cards that already exist (needed after a parser change)'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sbi-rates
  cancel-in-progress: false

jobs:
  reprocess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7        # full checkout: the PDFs are the input here

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r tools/requirements.txt

      - name: Re-derive cards from the archived PDFs
        run: |
          python tools/build_cards.py --archive archive --cards data/cards \
            ${{ inputs.force && '--force' || '' }}

      - name: Verify the re-derived cards
        run: python tools/verify.py --sample 200

      - name: Commit any changed cards
        run: |
          set -euo pipefail
          git config user.name  'sbi-rates-bot'
          git config user.email 'noreply@github.com'
          git add data/cards
          if git diff --cached --quiet; then
            echo "cards unchanged"
          else
            git commit -m "cards: re-derived from archive"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Re-deriving without republishing would leave the API serving the old
      # parse until the next new card happened to trigger a build.
      - name: Rebuild the API
        run: |
          python tools/build_api.py --cards data/cards \
            --observations data/observations.ndjson --out api

      - uses: actions/upload-pages-artifact@v5
        with:
          path: api

  publish:
    needs: reprocess
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
